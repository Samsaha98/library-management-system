<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Issue Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container mt-5" style="max-width:700px;">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Issue Book</h2>

        <a href="/" class="btn btn-secondary">
            Home
        </a>

    </div>

    <form method="POST">

        <!-- Campus -->

        <div class="mb-3">

            <label class="form-label">Campus</label>

            <select
                class="form-select"
                name="campus"
                onchange="window.location='?campus='+this.value">

                <option value="noida"
                    {% if campus=="noida" %}selected{% endif %}>
                    Greater Noida
                </option>

                <option value="delhi"
                    {% if campus=="delhi" %}selected{% endif %}>
                    Delhi
                </option>

                <option value="mumbai"
                    {% if campus=="mumbai" %}selected{% endif %}>
                    Mumbai
                </option>

            </select>

        </div>

        <!-- Student -->

        <div class="mb-3">

            <label class="form-label">Student</label>

            <select class="form-select" name="student_id" required>

                {% for student in students %}

                <option value="{{ student.id }}">
                    {{ student.name }}
                </option>

                {% endfor %}

            </select>

        </div>

        <!-- Book -->

        <div class="mb-3">

            <label class="form-label">Book</label>

            <select class="form-select" name="book_id" required>

                {% for book in books %}

                <option value="{{ book.id }}">
                    {{ book.title }}
                </option>

                {% endfor %}

            </select>

        </div>

        <!-- Issue Date -->

        <div class="mb-3">

            <label class="form-label">Issue Date</label>

            <input
                type="date"
                class="form-control"
                name="issue_date"
                required>

        </div>

        <!-- Due Date -->

        <div class="mb-4">

            <label class="form-label">Due Date</label>

            <input
                type="date"
                class="form-control"
                name="due_date"
                required>

        </div>

        <button class="btn btn-success w-100">
            Issue Book
        </button>

    </form>

</div>

</body>
</html>
