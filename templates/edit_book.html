{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow p-4">

            <h2 class="mb-4 text-center">
                ✏️ Edit Book
            </h2>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input
                        type="text"
                        class="form-control"
                        name="title"
                        value="{{ book.title }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Author</label>
                    <input
                        type="text"
                        class="form-control"
                        name="author"
                        value="{{ book.author }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input
                        type="text"
                        class="form-control"
                        name="category"
                        value="{{ book.category }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">ISBN</label>
                    <input
                        type="text"
                        class="form-control"
                        name="isbn"
                        value="{{ book.isbn }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantity</label>
                    <input
                        type="number"
                        class="form-control"
                        name="quantity"
                        value="{{ book.quantity }}"
                        required>
                </div>

                <div class="d-flex justify-content-between">

                    <a href="/" class="btn btn-secondary">
                        ← Back
                    </a>

                    <button
                        type="submit"
                        class="btn btn-success">
                        💾 Update Book
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
