<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Return Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">

        <h2>Return Book</h2>

        <a href="/" class="btn btn-secondary">
            Home
        </a>

    </div>

    <form method="GET" action="/return" class="mb-4">

        <label class="form-label">Campus</label>

        <select
            class="form-select"
            name="campus"
            onchange="this.form.submit()">

            <option value="noida"
                {% if campus=="noida" %}selected{% endif %}>
                Greater Noida
            </option>

            <option value="delhi"
                {% if campus=="delhi" %}selected{% endif %}>
                Delhi
            </option>

            <option value="mumbai"
                {% if campus=="mumbai" %}selected{% endif %}>
                Mumbai
            </option>

        </select>

    </form>

    <table class="table table-dark table-striped">

        <thead>

        <tr>

            <th>Student</th>
            <th>Book</th>
            <th>Issue Date</th>
            <th>Due Date</th>
            <th>Action</th>

        </tr>

        </thead>

        <tbody>

        {% for book in issued %}

        <tr>

            <td>{{ book.name }}</td>

            <td>{{ book.title }}</td>

            <td>{{ book.issue_date }}</td>

            <td>{{ book.due_date }}</td>

            <td>

                <a
                    href="/return/{{ book.id }}?campus={{ campus }}"
                    class="btn btn-success btn-sm">

                    Return

                </a>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
