<!DOCTYPE html>
<html>

<head>
    <title>Return Book</title>
</head>

<body>

<h1>Issued Books</h1>

<table border="1" cellpadding="10">

<tr>
    <th>Student</th>
    <th>Book</th>
    <th>Issue Date</th>
    <th>Due Date</th>
    <th>Action</th>
</tr>

{% for book in issued %}

<tr>

<td>{{ book.name }}</td>

<td>{{ book.title }}</td>

<td>{{ book.issue_date }}</td>

<td>{{ book.due_date }}</td>

<td>
<a href="/return/{{ book.id }}">
<button>Return</button>
</a>
</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/">Home</a>

</body>

</html>
