<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>All Campus Search</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

<h2>🌍 Search Across All Campuses</h2>

<a href="/" class="btn btn-secondary mb-4">
← Home
</a>

<form method="POST">

<div class="input-group mb-4">

<input
type="text"
name="keyword"
class="form-control"
placeholder="Enter Book Name">

<button class="btn btn-primary">
Search
</button>

</div>

</form>

<table class="table table-dark table-striped">

<thead>

<tr>

<th>Campus</th>
<th>Book</th>
<th>Author</th>
<th>Available</th>

</tr>

</thead>

<tbody>

{% for row in results %}

<tr>

<td>{{ row.campus }}</td>

<td>{{ row.title }}</td>

<td>{{ row.author }}</td>

<td>

{% if row.available > 0 %}

<span class="badge bg-success">

{{ row.available }} Copies

</span>

{% else %}

<span class="badge bg-danger">

Out of Stock

</span>

{% endif %}

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>

</html>
