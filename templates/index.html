<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
</head>
<body>

<h1>📚 Library Management System</h1>

<a href="/add">
    <button>Add Book</button>
</a>
<a href="/return">
    <button>Return Book</button>
</a>

<br><br>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Category</th>
        <th>ISBN</th>
        <th>Quantity</th>
        <th>Available</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.category }}</td>
        <td>{{ book.isbn }}</td>
        <td>{{ book.quantity }}</td>
        <td>{{ book.available }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
