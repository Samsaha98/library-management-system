{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card shadow-lg">

            <div class="card-header">

                <h3 class="mb-0">
                    <i class="bi bi-plus-circle"></i>
                    Add New Book
                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Book Title
                        </label>

                        <input
                        type="text"
                        class="form-control"
                        name="title"
                        required>

                    </div>



                    <div class="mb-3">

                        <label class="form-label">
                            Author
                        </label>

                        <input
                        type="text"
                        class="form-control"
                        name="author"
                        required>

                    </div>



                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <input
                        type="text"
                        class="form-control"
                        name="category">

                    </div>



                    <div class="mb-3">

                        <label class="form-label">
                            ISBN
                        </label>

                        <input
                        type="text"
                        class="form-control"
                        name="isbn">

                    </div>



                    <div class="mb-4">

                        <label class="form-label">
                            Quantity
                        </label>

                        <input
                        type="number"
                        class="form-control"
                        name="quantity"
                        required>

                    </div>



                    <div class="d-flex justify-content-between">

                        <a href="/"
                        class="btn btn-outline-light">

                            <i class="bi bi-arrow-left"></i>
                            Back

                        </a>



                        <button
                        type="submit"
                        class="btn btn-primary">

                            <i class="bi bi-save"></i>
                            Save Book

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
