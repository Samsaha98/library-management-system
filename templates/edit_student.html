<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Edit Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

<div class="card bg-secondary">

<div class="card-header">
<h3>✏ Edit Student</h3>
</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">
<label>Name</label>
<input
type="text"
name="name"
class="form-control"
value="{{ student.name }}"
required>
</div>

<div class="mb-3">
<label>Email</label>
<input
type="email"
name="email"
class="form-control"
value="{{ student.email }}"
required>
</div>

<div class="mb-3">
<label>Phone</label>
<input
type="text"
name="phone"
class="form-control"
value="{{ student.phone }}"
required>
</div>

<div class="mb-3">
<label>Department</label>
<input
type="text"
name="department"
class="form-control"
value="{{ student.department }}"
required>
</div>

<div class="mb-3">
<label>Campus</label>
<input
type="text"
name="campus"
class="form-control"
value="{{ student.campus }}"
required>
</div>

<button class="btn btn-warning">
Update Student
</button>

<a href="/students" class="btn btn-secondary">
Cancel
</a>

</form>

</div>

</div>

</div>

</body>

</html>
